<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Boda de Denisa y Pedro</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Great+Vibes&display=swap" rel="stylesheet">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            font-family: 'Cormorant Garamond', serif;
            background-color: #000;
        }
        .font-script {
            font-family: 'Great Vibes', cursive;
        }
        /* Configuración del vídeo de fondo */
        .video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }
        .video-container video {
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            object-fit: cover;
            opacity: 0.85; 
        }
        /* Efecto cristal esmerilado */
        .glass-panel {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body class="text-white min-h-screen flex flex-col items-center justify-center p-4">

    <div class="video-container bg-black">
        <!-- AQUÍ ESTÁ EL CAMBIO. Ahora busca el archivo con la doble extensión -->
        <video autoplay loop muted playsinline>
            <source src="video-fondo.mp4.mp4" type="video/mp4">
            Tu navegador no soporta vídeos HTML5.
        </video>
    </div>

    <div class="glass-panel w-full max-w-md rounded-3xl p-8 text-center flex flex-col gap-6 my-auto">
        
        <div>
            <p class="text-sm tracking-widest uppercase mb-2 text-white/90">¡Nos casamos!</p>
            <h1 class="font-script text-6xl text-white mb-2 shadow-sm drop-shadow-md">Denisa<br><span class="text-4xl font-serif">&</span><br>Pedro</h1>
        </div>

        <div class="w-16 h-px bg-white/50 mx-auto my-2"></div>

        <div class="text-lg leading-relaxed drop-shadow-md">
            <p class="font-semibold text-2xl mb-1">18 de Diciembre de 2027</p>
            <p class="text-xl">a las 11:30h</p>
        </div>

        <div class="bg-white/10 rounded-xl p-5 mt-2 border border-white/10">
            <a href="https://maps.app.goo.gl/njfLmuAkSgztffD98" target="_blank" rel="noopener noreferrer" class="inline-block bg-white text-gray-900 font-semibold py-3 px-8 rounded-full text-sm hover:bg-gray-200 transition-colors duration-300 shadow-lg uppercase tracking-wider">
                Ver Ubicación en Mapa
            </a>
        </div>

        <div class="w-16 h-px bg-white/50 mx-auto my-2"></div>

        <div>
            <p class="text-sm tracking-widest uppercase mb-4 text-white/90">Faltan</p>
            <div class="flex justify-center gap-3 md:gap-4">
                <div class="flex flex-col">
                    <span id="days" class="text-3xl font-semibold">00</span>
                    <span class="text-xs uppercase tracking-wider mt-1 text-white/80">Días</span>
                </div>
                <span class="text-2xl font-light text-white/50">:</span>
                <div class="flex flex-col">
                    <span id="hours" class="text-3xl font-semibold">00</span>
                    <span class="text-xs uppercase tracking-wider mt-1 text-white/80">Hrs</span>
                </div>
                <span class="text-2xl font-light text-white/50">:</span>
                <div class="flex flex-col">
                    <span id="minutes" class="text-3xl font-semibold">00</span>
                    <span class="text-xs uppercase tracking-wider mt-1 text-white/80">Min</span>
                </div>
                <span class="text-2xl font-light text-white/50">:</span>
                <div class="flex flex-col">
                    <span id="seconds" class="text-3xl font-semibold">00</span>
                    <span class="text-xs uppercase tracking-wider mt-1 text-white/80">Seg</span>
                </div>
            </div>
        </div>

    </div>

    <script>
        const countDownDate = new Date("Dec 18, 2027 11:30:00").getTime();

        const x = setInterval(function() {
            const now = new Date().getTime();
            const distance = countDownDate - now;

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            const formatTime = (time) => time < 10 ? "0" + time : time;

            document.getElementById("days").innerHTML = formatTime(days);
            document.getElementById("hours").innerHTML = formatTime(hours);
            document.getElementById("minutes").innerHTML = formatTime(minutes);
            document.getElementById("seconds").innerHTML = formatTime(seconds);

            if (distance < 0) {
                clearInterval(x);
                document.getElementById("days").innerHTML = "00";
                document.getElementById("hours").innerHTML = "00";
                document.getElementById("minutes").innerHTML = "00";
                document.getElementById("seconds").innerHTML = "00";
            }
        }, 1000);
    </script>
</body>
</html>
